<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}WERKcrew AI DEMO{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/demo/coordinator">WERKcrew AI <span>DEMO</span></a>
      <nav aria-label="Główna nawigacja">
        <a href="/demo/coordinator">Koordynator</a>
        {% if snapshot is defined and snapshot.site_visit %}
          <a href="/demo/field">WERKcrew Field</a>
        {% endif %}
      </nav>
    </header>
    <main class="page {% block page_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
